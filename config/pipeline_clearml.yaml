# ClearML Pipeline Configuration
# Пример конфигурации с Pydantic валидацией

data:
  data_path: "data/processed/publications_processed.csv"
  test_size: 0.2
  random_state: 42
  target_column: "author_count_category"  # null для автоопределения

logreg:
  C: 1.0
  max_iter: 1000
  solver: "lbfgs"  # lbfgs, saga, newton-cg

rf:
  n_estimators: 50
  max_depth: 8
  min_samples_split: 2

gb:
  n_estimators: 50
  learning_rate: 0.05
  max_depth: 3

svc:
  kernel: "rbf"  # rbf, linear, poly
  C: 1.0
  gamma: "scale"  # scale, auto, или float

clearml:
  project_name: "researchhub"
  pipeline_name: "researchhub-pipeline"
  pipeline_version: "1.0"
  default_queue: "default"
