# Конфигурация Docker Compose для ML проекта
# Включает: MLflow (трекинг), ClearML (MLOps), Jupyter (разработка)
#
# Команды запуска:
#   make clearml-server-up          # Запустить только ClearML
#   make mlflow-server-up           # Запустить только MLflow
#   make services-up                # Запустить все (MLflow + ClearML)
#   docker-compose up jupyter-dev   # Jupyter (профиль development)
#
# Порты:
#   - MLflow UI: http://localhost:3000
#   - ClearML UI: http://localhost:8090
#   - ClearML API: http://localhost:8008
#   - ClearML Files: http://localhost:8091
#
version: "3.8"

services:
  # ========================================
  # ClearML Server Infrastructure
  # ========================================
  
  clearml-apiserver:
    image: allegroai/clearml:1.16.2
    container_name: clearml-apiserver
    restart: unless-stopped
    command: apiserver
    environment:
      CLEARML_API_HOST: "http://127.0.0.1:8008"
      CLEARML_ELASTIC_SERVICE_HOST: clearml-elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: clearml-mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: clearml-redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
      # Fixed Users Mode для простоты
      CLEARML__apiserver__auth__fixed_users__enabled: "true"
      CLEARML__apiserver__auth__fixed_users__users: '[{"username": "admin", "password": "admin", "name": "Admin User"}]'
      CLEARML__apiserver__auth__fixed_users__pass_hashed: "false"
    ports:
      - "8008:8008"
    depends_on:
      clearml-elasticsearch:
        condition: service_healthy
      clearml-mongo:
        condition: service_healthy
      clearml-redis:
        condition: service_healthy
    networks:
      - ml-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/debug.ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  clearml-webserver:
    image: allegroai/clearml:1.16.2
    container_name: clearml-webserver
    restart: unless-stopped
    command: webserver
    environment:
      CLEARML_API_HOST: "http://clearml-apiserver:8008"
    ports:
      - "8090:80"
    depends_on:
      - clearml-apiserver
    networks:
      - ml-network
    mem_limit: 256m

  clearml-fileserver:
    image: allegroai/clearml:1.16.2
    container_name: clearml-fileserver
    restart: unless-stopped
    command: fileserver
    environment:
      CLEARML_API_HOST: "http://clearml-apiserver:8008"
    ports:
      - "8091:8081"
    volumes:
      - clearml-fileserver:/mnt/fileserver
    networks:
      - ml-network
    mem_limit: 256m

  clearml-elasticsearch:
    image: elasticsearch:7.16.2
    container_name: clearml-elasticsearch
    restart: unless-stopped
    environment:
      - cluster.name=clearml
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - xpack.monitoring.enabled=false
      - xpack.ml.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - cluster.routing.allocation.disk.watermark.low=10gb
      - cluster.routing.allocation.disk.watermark.high=5gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - indices.memory.index_buffer_size=5%
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - clearml-elastic:/usr/share/elasticsearch/data
    networks:
      - ml-network
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  clearml-mongo:
    image: mongo:4.4
    container_name: clearml-mongo
    restart: unless-stopped
    command: --wiredTigerCacheSizeGB 0.5
    volumes:
      - clearml-mongo:/data/db
    networks:
      - ml-network
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  clearml-redis:
    image: redis:6.0-alpine
    container_name: clearml-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - clearml-redis:/data
    networks:
      - ml-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Опционально: Agent для выполнения ClearML задач
  clearml-agent:
    image: allegroai/clearml-agent:latest
    container_name: clearml-agent
    restart: unless-stopped
    environment:
      CLEARML_API_HOST: "http://clearml-apiserver:8008"
      CLEARML_WEB_HOST: "http://clearml-webserver:80"
      CLEARML_FILES_HOST: "http://clearml-fileserver:8081"
      CLEARML_API_ACCESS_KEY: ""
      CLEARML_API_SECRET_KEY: ""
      CLEARML_WORKER_ID: "default-worker"
      CLEARML_WORKER_NAME: "default-worker"
    depends_on:
      - clearml-apiserver
    networks:
      - ml-network
    mem_limit: 512m
    profiles:
      - with-agent

  # ========================================
  # MLflow и ML приложения
  # ========================================
  
  # MLflow сервер отслеживания
  mlflow-server:
    build:
      context: .
      target: base
    container_name: mlflow-server
    ports:
      - "3000:3000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlartifacts:/app/mlartifacts
      - ./data:/app/data
      - ./models:/app/models
      - ./params.yaml:/app/params.yaml
    environment:
      - MLFLOW_BACKEND_STORE_URI=file:./mlruns
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=./mlartifacts
      - PYTHONPATH=/app
    command: ["mlflow-server"]
    networks:
      - ml-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Сервис ML приложения
  ml-app:
    build:
      context: .
      target: base
    container_name: ml-app
    depends_on:
      - mlflow-server
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
      - ./scripts:/app/scripts
      - ./researchhub:/app/researchhub
      - ./params.yaml:/app/params.yaml
      - ./dvc.yaml:/app/dvc.yaml
      - ./.dvc:/app/.dvc
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:3000
      - DVC_STUDIO_OFFLINE=true
      - PYTHONPATH=/app
    networks:
      - ml-network
    restart: "no"
    profiles:
      - training

  # Среда разработки с Jupyter
  jupyter-dev:
    build:
      context: .
      target: development
    container_name: jupyter-dev
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./models:/app/models
      - ./notebooks:/app/notebooks
      - ./mlruns:/app/mlruns
      - ./params.yaml:/app/params.yaml
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:3000
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONPATH=/app
    networks:
      - ml-network
    depends_on:
      - mlflow-server
    restart: unless-stopped
    profiles:
      - development

  # Сервис предобработки данных
  data-preprocessing:
    build:
      context: .
      target: base
    container_name: data-preprocessing
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./params.yaml:/app/params.yaml
      - ./.dvc:/app/.dvc
    environment:
      - PYTHONPATH=/app
      - DVC_STUDIO_OFFLINE=true
    networks:
      - ml-network
    command: ["preprocess"]
    restart: "no"
    profiles:
      - preprocessing

  # Сервис обучения модели
  model-training:
    build:
      context: .
      target: base
    container_name: model-training
    depends_on:
      - mlflow-server
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./scripts:/app/scripts
      - ./mlruns:/app/mlruns
      - ./params.yaml:/app/params.yaml
      - ./dvc.yaml:/app/dvc.yaml
      - ./.dvc:/app/.dvc
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:3000
      - PYTHONPATH=/app
      - DVC_STUDIO_OFFLINE=true
    networks:
      - ml-network
    command: ["pipeline"]
    restart: "no"
    profiles:
      - training

networks:
  ml-network:
    driver: bridge

volumes:
  # MLflow volumes
  mlruns-data:
  models-data:
  data-storage:
  # ClearML volumes
  clearml-elastic:
    driver: local
  clearml-mongo:
    driver: local
  clearml-redis:
    driver: local
  clearml-fileserver:
    driver: local

# Переопределение конфигураций для разных сред
x-common-environment: &common-env
  PYTHONPATH: /app
  MLFLOW_TRACKING_URI: http://mlflow-server:3000
  DVC_STUDIO_OFFLINE: true

x-common-volumes: &common-volumes
  - ./data:/app/data
  - ./models:/app/models
  - ./mlruns:/app/mlruns
  - ./scripts:/app/scripts
  - ./params.yaml:/app/params.yaml
  - ./.dvc:/app/.dvc

# Примеры использования в комментариях:
#
# Режим разработки с Jupyter:
# docker-compose --profile development up
#
# Запуск только MLflow сервера:
# docker-compose up mlflow-server
#
# Запуск полного пайплайна обучения:
# docker-compose --profile training up model-training
#
# Запуск предобработки данных:
# docker-compose --profile preprocessing up data-preprocessing
#
# Запуск всего для разработки:
# docker-compose --profile development --profile training up
#
# Проверка параметров из params.yaml:
# docker-compose run --rm ml-app params-info
#
# Запуск полного DVC pipeline:
# docker-compose run --rm ml-app pipeline
#
# Развертывание в продакшене:
# docker-compose up mlflow-server
# docker-compose run --rm ml-app train
#
# Масштабирование MLflow для высокой доступности:
# docker-compose up --scale mlflow-server=2
#
# Проверка статуса DVC:
# docker-compose run --rm ml-app dvc-status
#
# Интерактивная работа:
# docker-compose run --rm ml-app bash
