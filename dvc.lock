schema: '2.0'
stages:
  fetch_data:
    cmd: python scripts/fetch_arxiv_data.py --query "cat:eess.IV OR cat:cs.CV OR cat:q-bio.QM
      OR cat:cs.LG" --max-results 100 --output-dir data/raw
    deps:
    - path: scripts/fetch_arxiv_data.py
      hash: md5
      md5: f8f702789871bda59a32d483df30a600
      size: 13353
    params:
      params.yaml:
        data.max_results: 100
        data.query: cat:eess.IV OR cat:cs.CV OR cat:q-bio.QM OR cat:cs.LG
    outs:
    - path: data/raw/arxiv_metadata.yaml
      hash: md5
      md5: 1316c0d18a01216dc83244d80e225db1
      size: 1393
    - path: data/raw/arxiv_publications.csv
      hash: md5
      md5: 1e3dccb6e07eb1de7d77e6b3671283d9
      size: 169702
  preprocess:
    cmd: python scripts/preprocess_data.py --input data/raw/arxiv_publications.csv
      --output data/processed/publications_processed.csv --params params.yaml
    deps:
    - path: data/raw/arxiv_metadata.yaml
      hash: md5
      md5: 1316c0d18a01216dc83244d80e225db1
      size: 1393
    - path: data/raw/arxiv_publications.csv
      hash: md5
      md5: 1e3dccb6e07eb1de7d77e6b3671283d9
      size: 169702
    - path: scripts/preprocess_data.py
      hash: md5
      md5: d60eec16158e16d84998fc736a471c70
      size: 12679
    params:
      params.yaml:
        feature_engineering.categorical_columns:
        - journal_category
        - year_category
        - author_count_category
        feature_engineering.max_df: 0.95
        feature_engineering.min_df: 2
        feature_engineering.ngram_range:
        - 1
        - 2
        feature_engineering.numerical_columns:
        - year
        - title_length
        - abstract_length
        - author_count
        - num_keywords
        feature_engineering.text_columns:
        - title
        - abstract
        - keywords
        feature_engineering.tfidf_max_features: 5000
    outs:
    - path: data/processed/processing_metadata.yaml
      hash: md5
      md5: 7b0275d98640b9ff91387fe2e7d77dba
      size: 1087
    - path: data/processed/publications_processed.csv
      hash: md5
      md5: fc45327f1df7e09a650d6bd9789be33d
      size: 313648
  train_rf:
    cmd: python scripts/train_model.py --input data/processed/publications_processed.csv
      --model-output models/rf_classifier.pkl --metrics models/rf_metrics.json --algorithm
      RandomForestClassifier
    deps:
    - path: data/processed/processing_metadata.yaml
      hash: md5
      md5: 7b0275d98640b9ff91387fe2e7d77dba
      size: 1087
    - path: data/processed/publications_processed.csv
      hash: md5
      md5: fc45327f1df7e09a650d6bd9789be33d
      size: 313648
    - path: scripts/train_model.py
      hash: md5
      md5: 1d4592100bd9a9fa3ecc7ee79651175f
      size: 17844
    params:
      params.yaml:
        mlflow.experiment_name: arxiv_publications_classification
        mlflow.tracking_uri: file:./mlruns
        train.random_forest:
          n_estimators: 200
          max_depth: 10
          min_samples_split: 5
          min_samples_leaf: 2
          max_features: sqrt
          bootstrap: true
          oob_score: true
        train.random_state: 42
        train.test_size: 0.2
    outs:
    - path: models/rf_classifier.pkl
      hash: md5
      md5: 985de0450b62d2431178bb6a470cdcfd
      size: 2094601
    - path: models/rf_classifier_metadata.yaml
      hash: md5
      md5: e3a80df8a333a258308c2330853772c0
      size: 1121
    - path: models/rf_metrics.json
