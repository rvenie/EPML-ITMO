      hash: md5
      md5: 7b0275d98640b9ff91387fe2e7d77dba
      size: 1087
    - path: data/processed/publications_processed.csv
      hash: md5
      md5: fc45327f1df7e09a650d6bd9789be33d
      size: 313648
    - path: scripts/train_model.py
      hash: md5
      md5: 1d4592100bd9a9fa3ecc7ee79651175f
      size: 17844
    params:
      params.yaml:
        mlflow.experiment_name: arxiv_publications_classification
        mlflow.tracking_uri: file:./mlruns
        train.random_state: 42
        train.svm:
