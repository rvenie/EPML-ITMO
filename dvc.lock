schema: '2.0'
stages:
  fetch_data:
    cmd: python scripts/fetch_arxiv_data.py --query "cat:eess.IV OR cat:cs.CV OR
      cat:q-bio.QM OR cat:cs.LG" --max-results 100 --output-dir data/raw
    deps:
    - path: scripts/fetch_arxiv_data.py
      hash: md5
      md5: 9b5d563dc64e99141899e3cf9ea72bc3
      size: 15921
    params:
      params.yaml:
        data.max_results: 100
        data.query: cat:eess.IV OR cat:cs.CV OR cat:q-bio.QM OR cat:cs.LG
    outs:
    - path: data/raw/arxiv_metadata.yaml
      hash: md5
      md5: 122f4d00b47b54d1466c5b9d0eb9779d
      size: 1397
    - path: data/raw/arxiv_publications.csv
      hash: md5
      md5: f31e62c8234520e29a6d7beb99c0abe0
      size: 172982
  preprocess:
    cmd: python scripts/preprocess_data.py --input 
      data/raw/arxiv_publications.csv --output 
      data/processed/publications_processed.csv --params params.yaml
    deps:
    - path: data/raw/arxiv_metadata.yaml
      hash: md5
      md5: 122f4d00b47b54d1466c5b9d0eb9779d
      size: 1397
    - path: data/raw/arxiv_publications.csv
      hash: md5
      md5: f31e62c8234520e29a6d7beb99c0abe0
      size: 172982
    - path: scripts/preprocess_data.py
      hash: md5
      md5: 3b17029a26f53aacc11ac05e49c9700b
      size: 16791
    params:
      params.yaml:
        feature_engineering.categorical_columns:
        - journal_category
        - year_category
        - author_count_category
        feature_engineering.max_df: 0.95
        feature_engineering.min_df: 2
        feature_engineering.ngram_range:
        - 1
        - 2
        feature_engineering.numerical_columns:
        - year
        - title_length
        - abstract_length
        - author_count
        - num_keywords
        feature_engineering.text_columns:
        - title
        - abstract
        - keywords
        feature_engineering.tfidf_max_features: 5000
    outs:
    - path: data/processed/processing_metadata.yaml
      hash: md5
      md5: d206e8890d46abc91c11be95ebfbb170
      size: 1087
    - path: data/processed/publications_processed.csv
      hash: md5
      md5: 0857262ff1eaa5dcd682629c8f000447
      size: 319401
  train_rf:
    cmd: python scripts/train_model.py --input 
      data/processed/publications_processed.csv --model-output 
      models/rf_classifier.pkl --metrics models/rf_metrics.json --algorithm 
      RandomForestClassifier
    deps:
    - path: data/processed/processing_metadata.yaml
      hash: md5
      md5: d206e8890d46abc91c11be95ebfbb170
      size: 1087
    - path: data/processed/publications_processed.csv
      hash: md5
      md5: 0857262ff1eaa5dcd682629c8f000447
      size: 319401
    - path: scripts/train_model.py
      hash: md5
      md5: bd8dd16cd95dc86ee26b5a2e734d929a
      size: 26049
    params:
      params.yaml:
        mlflow.experiment_name: arxiv_publications_classification
        mlflow.tracking_uri: file:./mlruns
        train.random_forest:
          n_estimators: 200
          max_depth: 10
          min_samples_split: 5
          min_samples_leaf: 2
          max_features: sqrt
          bootstrap: true
          oob_score: true
        train.random_state: 42
        train.test_size: 0.2
    outs:
    - path: models/rf_classifier.pkl
      hash: md5
      md5: 7593e3985daf7902ac9b5480837d11f2
      size: 2667321
    - path: models/rf_classifier_metadata.yaml
      hash: md5
      md5: c6eec49f136dad49b6c8ffc98831ec52
      size: 1122
    - path: models/rf_metrics.json
      hash: md5
      md5: b48840af9126e82ab164657a5c4279e3
      size: 518
  train_svm:
    cmd: python scripts/train_model.py --input 
      data/processed/publications_processed.csv --model-output 
      models/svm_classifier.pkl --metrics models/svm_metrics.json --algorithm 
      SVM
    deps:
    - path: data/processed/processing_metadata.yaml
      hash: md5
      md5: d206e8890d46abc91c11be95ebfbb170
      size: 1087
    - path: data/processed/publications_processed.csv
      hash: md5
      md5: 0857262ff1eaa5dcd682629c8f000447
      size: 319401
    - path: scripts/train_model.py
      hash: md5
      md5: bd8dd16cd95dc86ee26b5a2e734d929a
      size: 26049
    params:
      params.yaml:
        mlflow.experiment_name: arxiv_publications_classification
        mlflow.tracking_uri: file:./mlruns
        train.random_state: 42
        train.svm:
          kernel: rbf
          C: 1.0
          gamma: scale
          probability: true
        train.test_size: 0.2
    outs:
    - path: models/svm_classifier.pkl
      hash: md5
      md5: 00ad229862f35a95eab697b7de9614b7
