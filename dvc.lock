schema: '2.0'
stages:
  fetch_data:
    cmd: python scripts/fetch_arxiv_data.py --query "cat:eess.IV OR cat:cs.CV OR
      cat:q-bio.QM OR cat:cs.LG" --max-results 100 --output-dir data/raw
    deps:
    - path: scripts/fetch_arxiv_data.py
      hash: md5
      md5: 5ad42a234437f700b2d2537bfbe4f88a
      size: 13643
    params:
      params.yaml:
        data.max_results: 100
        data.query: cat:eess.IV OR cat:cs.CV OR cat:q-bio.QM OR cat:cs.LG
    outs:
    - path: data/raw/arxiv_metadata.yaml
      hash: md5
      md5: cd84144ba869fc7e37075ea877c073ad
      size: 1407
    - path: data/raw/arxiv_publications.csv
      hash: md5
      md5: 4dee3cb756732ce4284df3d3302161a0
      size: 174412
  preprocess:
    cmd: python scripts/preprocess_data.py --input 
      data/raw/arxiv_publications.csv --output 
      data/processed/publications_processed.csv
    deps:
    - path: data/raw/arxiv_metadata.yaml
      hash: md5
      md5: cd84144ba869fc7e37075ea877c073ad
      size: 1407
    - path: data/raw/arxiv_publications.csv
      hash: md5
      md5: 4dee3cb756732ce4284df3d3302161a0
      size: 174412
    - path: scripts/preprocess_data.py
      hash: md5
      md5: f51e5e95fa5c712d01ed627f8282a724
      size: 10972
    params:
      params.yaml:
        feature_engineering.categorical_columns:
        - journal_category
        - year_category
        - author_count_category
        feature_engineering.numerical_columns:
        - year
        - title_length
        - abstract_length
        - author_count
        - num_keywords
        feature_engineering.text_columns:
        - title
        - abstract
        - keywords
    outs:
    - path: data/processed/processing_metadata.yaml
      hash: md5
      md5: 302e4983a64d726d6017cea817bd5e8d
      size: 706
    - path: data/processed/publications_processed.csv
      hash: md5
      md5: 7a4c803b327cd4f1f4c96a8ad60e920b
      size: 323398
  run_experiments:
    cmd: python scripts/run_experiments.py
    deps:
    - path: data/processed/publications_processed.csv
      hash: md5
      md5: 7a4c803b327cd4f1f4c96a8ad60e920b
      size: 323398
    - path: scripts/run_experiments.py
      hash: md5
      md5: 78ed248f1f988e3f8f860595d4a2b87e
      size: 18402
    - path: scripts/train_model.py
      hash: md5
      md5: 4b4c50a6f8ae2480f8fb537e8c8328d7
      size: 17136
    params:
      params.yaml:
        feature_engineering:
          tfidf_max_features: 5000
          ngram_range:
          - 1
          - 2
          min_df: 2
          max_df: 0.95
          use_tfidf: true
          lowercase: true
          stop_words: english
          text_columns:
          - title
          - abstract
          - keywords
          categorical_columns:
          - journal_category
          - year_category
          - author_count_category
          numerical_columns:
          - year
          - title_length
          - abstract_length
          - author_count
          - num_keywords
        mlflow:
          experiment_name: arxiv_publications_classification
          run_name: baseline_model
          tracking_uri: file:./mlruns
          tags:
            project: research_agents_hub
            data_source: arxiv
            model_type: classification
            data_version: v2.0
            pipeline_version: automated
          log_artifacts:
          - models/
          - reports/
          - data/processed/
        train:
          algorithm: RandomForestClassifier
          test_size: 0.2
          random_state: 42
          cross_validation:
            folds: 5
            scoring: accuracy
            stratify: true
          random_forest:
            n_estimators: 100
            max_depth: 10
            min_samples_split: 5
            min_samples_leaf: 2
            max_features: sqrt
            bootstrap: true
            oob_score: true
          svm:
            kernel: rbf
            C: 1.0
            gamma: scale
            probability: true
          logistic_regression:
            penalty: l2
            C: 1.0
            max_iter: 1000
            solver: lbfgs
    outs:
    - path: experiments
      hash: md5
      md5: 72e04e2bf2c25e38c552d9ce2521b81b.dir
      size: 21125927
      nfiles: 51
    - path: experiments_summary.json
      hash: md5
      md5: 143c2c948f00ee5d180d4000c84ad8eb
      size: 57554
