# DVC Pipeline Configuration
# Automated ML pipeline with ArXiv data fetching for reproducible research

stages:
  # Stage 1: Fetch data from ArXiv API
  fetch_data:
    cmd: python scripts/fetch_arxiv_data.py --query "${data.query}" --max-results
      ${data.max_results} --output-dir data/raw
    deps:
    - scripts/fetch_arxiv_data.py
    params:
    - data.query
    - data.max_results
    outs:
    - data/raw/arxiv_publications.csv
    - data/raw/arxiv_metadata.yaml
    desc: Fetch research papers from ArXiv API with specified query and parameters

  # Stage 2: Preprocess the raw data
  preprocess:
    cmd: python scripts/preprocess_data.py --input data/raw/arxiv_publications.csv
      --output data/processed/publications_processed.csv
    deps:
    - scripts/preprocess_data.py
    - data/raw/arxiv_publications.csv
    - data/raw/arxiv_metadata.yaml
    params:
    - feature_engineering.text_columns
    - feature_engineering.categorical_columns
    - feature_engineering.numerical_columns
    outs:
    - data/processed/publications_processed.csv
    - data/processed/processing_metadata.yaml
    desc: Clean and preprocess raw ArXiv data for ML training

  # Stage 3: Train a single baseline model
  train:
    cmd: python scripts/train_model.py 
      --input data/processed/publications_processed.csv 
      --model-output models/baseline_model.pkl 
      --metrics models/baseline_metrics.json 
      --params params.yaml
    deps:
    - scripts/train_model.py
    - data/processed/publications_processed.csv
    params:
    - train
    - feature_engineering
    - mlflow
    outs:
    - models/baseline_model.pkl
    - models/baseline_model_metadata.yaml
    metrics:
    - models/baseline_metrics.json:
        cache: false
    desc: Train baseline classification model with MLflow tracking

  # Stage 4: Run multiple experiments with different algorithms and parameters
  run_experiments:
    cmd: python scripts/run_experiments.py
    deps:
    - scripts/run_experiments.py
    - scripts/train_model.py
    - data/processed/publications_processed.csv
    params:
    - train
    - feature_engineering
    - mlflow
    outs:
    - experiments:
        cache: false
    metrics:
    - experiments_summary.json:
        cache: false
    desc: Run 15+ ML experiments with different algorithms and hyperparameters

plots:
- reports/confusion_matrix.png:
    title: Model Confusion Matrix
    template: confusion

- reports/feature_importance.png:
    title: Feature Importance Analysis
    template: bar_horizontal

- metrics.json:
    title: Training Metrics
    x: epoch
    y:
    - accuracy
    - precision
    - recall
    - f1_score

# Artifacts configuration
artifacts:
  model:
    path: models/classifier.pkl
    type: model
    desc: Trained classification model for research publication analysis
    labels:
    - classification
    - research-papers
    - arxiv

  processed_data:
    path: data/processed/publications_processed.csv
    type: dataset
    desc: Preprocessed ArXiv publications dataset
    labels:
    - processed
    - publications
    - features
